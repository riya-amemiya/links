name: PR Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture and comment page screenshots
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: "true"

      - name: Install dependencies
        run: devbox run bun:install

      - name: Build
        env:
          NEXT_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_URL }}
        run: devbox run bun:build

      - name: Capture screenshots
        env:
          CI: "true"
          NEXT_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_URL }}
        run: devbox run -- bun run test:e2e:screenshots

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-screenshots
          path: e2e/output/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Publish screenshots branch for embed URLs
        env:
          BRANCH: screenshots/pr-${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp e2e/output/boot.png e2e/output/home.png e2e/output/works.png "$work/"
          cd "$work"
          git init
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boot.png home.png works.png
          git commit -m "screenshots for PR #${{ github.event.pull_request.number }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin "HEAD:$BRANCH"

      - name: Comment screenshots on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const base = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/screenshots/pr-${pr}`;
            const bust = `t=${Date.now()}`;
            const body = [
              "<!-- pr-screenshots -->",
              "## Page screenshots",
              "",
              "| Boot `/` | Home `/home` | Works `/works` |",
              "|:--:|:--:|:--:|",
              `| ![boot](${base}/boot.png?${bust}) | ![home](${base}/home.png?${bust}) | ![works](${base}/works.png?${bust}) |`,
              "",
              `_head \`${sha}\` · [workflow run](${runUrl})_`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes("<!-- pr-screenshots -->"),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
